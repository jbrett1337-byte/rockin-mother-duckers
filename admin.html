<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RMD Giveaway Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  text-align:center
}

.header{
  padding:28px 16px 8px
}

.header h1{
  margin:0;
  font-size:clamp(2rem,8vw,4.5rem);
  font-style:italic;
  text-transform:uppercase;
  line-height:.95
}

.rockin{color:#fff}
.duckers{color:#f5b800}

.header p{
  color:#aaa;
  font-size:1.05rem;
  margin:12px 0 0
}

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.login-box{
  width:min(92vw,420px);
  background:#151515;
  border:2px solid #333;
  border-radius:22px;
  padding:30px 22px
}

.login-box h1{
  margin:0;
  font-size:2rem
}

.login-box h2{
  color:#f5b800;
  margin:8px 0 25px;
  font-size:1rem
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #555;
  background:#0c0c0c;
  color:#fff;
  font-size:1rem
}

.login-box input{
  margin:7px 0
}

.login-error{
  color:#ff6969;
  min-height:20px;
  margin:10px 0
}

button{
  border:none;
  border-radius:12px;
  padding:14px 18px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
  text-transform:uppercase;
  background:#f5b800;
  color:#111
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

#adminApp{
  display:none
}

.top-bar{
  width:min(92vw,700px);
  margin:10px auto;
  display:flex;
  justify-content:flex-end
}

.logout,
.secondary{
  background:#333;
  color:#fff
}

.admin-panel,
.entries{
  width:min(92vw,700px);
  margin:14px auto
}

.admin-panel{
  background:#151515;
  border:2px solid #333;
  border-radius:18px;
  padding:16px
}

.add-row{
  display:flex;
  gap:8px
}

.add-row input{
  flex:1
}

.wheel-area{
  position:relative;
  width:min(90vw,650px);
  aspect-ratio:1;
  margin:12px auto 25px
}

#pointer{
  position:absolute;
  z-index:5;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:28px solid transparent;
  border-right:28px solid transparent;
  border-top:55px solid #f5b800
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:10px solid #f5b800;
  background:#222;
  transition:transform 20s cubic-bezier(.12,.85,.15,1)
}

.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:10px 16px 25px
}

.entries h3{
  color:#f5b800
}

.entry{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#181818;
  border:1px solid #333;
  border-radius:12px;
  padding:10px 12px;
  margin:7px 0;
  text-align:left
}

.actions{
  display:flex;
  gap:6px
}

.mini{
  padding:6px 10px;
  font-size:.85rem
}

.remove{
  background:#b31313;
  color:#fff
}

.empty{
  color:#777;
  padding:20px
}

.status{
  color:#f5b800;
  font-weight:bold
}

#winner{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:20px
}

#winner.show{
  display:flex
}

.winner-box{
  background:#151515;
  border:4px solid #f5b800;
  border-radius:25px;
  padding:40px 25px;
  max-width:500px;
  width:100%
}

.winner-box h2{
  font-size:1.1rem;
  color:#f5b800
}

#winnerName{
  font-size:clamp(2rem,10vw,4rem);
  word-break:break-word
}

.footer{
  color:#555;
  padding:20px
}

@media(max-width:480px){
  .add-row{flex-direction:column}
}
</style>
</head>

<body>

<div id="loginScreen">
  <div class="login-box">

    <h1>RMD ADMIN</h1>
    <h2>🦆 GIVEAWAY CONTROL PANEL</h2>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <div id="loginError" class="login-error"></div>

    <button id="loginBtn">LOGIN</button>

  </div>
</div>

<div id="adminApp">

  <div class="top-bar">
    <button id="logoutBtn" class="logout">LOGOUT</button>
  </div>

  <div class="header">
    <h1>
      <span class="rockin">RMD</span>
      <span class="duckers"> ADMIN</span>
    </h1>
    <p>🦆 GIVEAWAY CONTROL PANEL</p>
  </div>

  <div class="admin-panel">

    <div class="add-row">
      <input id="nameInput" maxlength="60" placeholder="Enter a name...">
      <button id="addBtn">+ ADD ENTRY</button>
    </div>

    <p class="status">Connected</p>

  </div>

  <div class="wheel-area">
    <div id="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <div class="controls">
    <button id="spinBtn">🦆 SPIN THE MOTHER DUCKER!</button>
    <button id="resetBtn" class="secondary">RESET DISPLAY</button>
  </div>

  <div class="entries">
    <h3>ADMIN ENTRIES</h3>
    <div id="count"></div>
    <div id="entryList"></div>
  </div>

  <div id="winner">
    <div class="winner-box">
      <h2>🦆 WINNER WINNER MOTHER DUCKER! 🦆</h2>
      <h1 id="winnerName"></h1>
      <button id="closeWinner">CLOSE</button>
    </div>
  </div>

  <div class="footer">
    ROCKIN MOTHER DUCKERS • 800 MEMBER GIVEAWAY
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCScB2EiV47XvJ0Jm5smJ7Z_B_l8j3NGho",
  authDomain: "rmd-giveaway.firebaseapp.com",
  databaseURL: "https://rmd-giveaway-default-rtdb.firebaseio.com",
  projectId: "rmd-giveaway",
  storageBucket: "rmd-giveaway.firebasestorage.app",
  messagingSenderId: "891164634736",
  appId: "1:891164634736:web:cb0a15e2cff8700f924eb5"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const SPIN_DURATION = 20000;


/* LOGIN */

const loginScreen = document.getElementById("loginScreen");
const adminApp = document.getElementById("adminApp");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");


loginBtn.onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    loginError.textContent = "Enter your email and password.";
    return;
  }

  loginBtn.disabled = true;
  loginError.textContent = "Logging in...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    loginError.textContent =
      "Incorrect email or password.";

  }

  loginBtn.disabled = false;

};


document.getElementById("password")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") loginBtn.click();
});


document.getElementById("logoutBtn")
.onclick = async ()=>{
  await signOut(auth);
};


onAuthStateChanged(auth,user=>{

  if(user){
    loginScreen.style.display="none";
    adminApp.style.display="block";
  }else{
    loginScreen.style.display="flex";
    adminApp.style.display="none";
  }

});


/* GIVEAWAY */

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let entries = [];
let rotation = 0;
let spinning = false;


function drawWheel(){

  const s=canvas.width;
  const c=s/2;
  const r=c-8;

  ctx.clearRect(0,0,s,s);

  if(!entries.length){

    ctx.beginPath();
    ctx.arc(c,c,r,0,Math.PI*2);
    ctx.fillStyle="#222";
    ctx.fill();

    ctx.fillStyle="#f5b800";
    ctx.font="bold 28px Arial";
    ctx.textAlign="center";
    ctx.fillText("ADD ENTRIES",c,c);

    return;
  }

  const slice=Math.PI*2/entries.length;

  entries.forEach((name,i)=>{

    const start=i*slice-Math.PI/2;

    ctx.beginPath();
    ctx.moveTo(c,c);
    ctx.arc(c,c,r,start,start+slice);
    ctx.closePath();

    ctx.fillStyle =
      i%3===0 ? "#b31313" :
      i%3===1 ? "#181818" :
      "#08783d";

    ctx.fill();

    ctx.strokeStyle="#f5b800";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.save();

    ctx.translate(c,c);
    ctx.rotate(start+slice/2);

    ctx.fillStyle="#fff";

    ctx.font=`bold ${
      Math.max(10,Math.min(22,220/entries.length))
    }px Arial`;

    ctx.textAlign="right";

    const displayName =
      name.length>20
      ? name.slice(0,20)+"…"
      : name;

    ctx.fillText(displayName,r-28,6);

    ctx.restore();

  });

  ctx.beginPath();
  ctx.arc(c,c,70,0,Math.PI*2);
  ctx.fillStyle="#f5b800";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(c,c,55,0,Math.PI*2);
  ctx.fillStyle="#111";
  ctx.fill();

  ctx.fillStyle="#f5b800";
  ctx.font="bold 16px Arial";
  ctx.textAlign="center";
  ctx.fillText("RMD",c,c+6);

}


function render(){

  document.getElementById("count").textContent =
    `${entries.length} total ${
      entries.length===1 ? "entry" : "entries"
    }`;

  const list=document.getElementById("entryList");

  list.innerHTML =
    entries.length
    ? ""
    : "<div class='empty'>No entries yet.</div>";

  entries.forEach((name,i)=>{

    const row=document.createElement("div");
    row.className="entry";

    const nameText=document.createElement("span");
    nameText.textContent=name;

    const actions=document.createElement("div");
    actions.className="actions";

    const plus=document.createElement("button");
    plus.className="mini";
    plus.textContent="+1";

    plus.onclick=()=>{

      if(spinning) return;

      entries.splice(i+1,0,name);
      saveEntries();

    };


    const del=document.createElement("button");
    del.className="mini remove";
    del.textContent="Remove";

    del.onclick=()=>{

      if(spinning) return;

      entries.splice(i,1);
      saveEntries();

    };

    actions.append(plus,del);
    row.append(nameText,actions);
    list.append(row);

  });

  drawWheel();

}


function saveEntries(){

  set(
    ref(db,"giveaway/entries"),
    entries
  );

}


onValue(
  ref(db,"giveaway/entries"),
  snapshot=>{

    entries =
      Array.isArray(snapshot.val())
      ? snapshot.val().filter(Boolean)
      : [];

    render();

  }
);


/* ADD ENTRY */

function addEntry(){

  const input=document.getElementById("nameInput");
  const name=input.value.trim();

  if(!name) return;

  entries.push(name);

  input.value="";
  saveEntries();
  input.focus();

}


document.getElementById("addBtn")
.onclick=addEntry;


document.getElementById("nameInput")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") addEntry();
});


document.getElementById("closeWinner")
.onclick=()=>{
  document.getElementById("winner")
  .classList.remove("show");
};


/* SPIN */

document.getElementById("spinBtn")
.onclick=async()=>{

  if(spinning || entries.length<2){

    alert("Add at least 2 entries.");

    return;

  }

  spinning=true;

  document.getElementById("spinBtn").disabled=true;


  const winnerIndex =
    Math.floor(Math.random()*entries.length);

  const winnerName =
    entries[winnerIndex];

  const spinId=Date.now();

  const deg=360/entries.length;

  const center=
    winnerIndex*deg+deg/2;


  /*
  Save spin as actively spinning FIRST.
  */

  await set(
    ref(db,"giveaway/spin"),
    {
      id:spinId,
      status:"spinning",
      startedAt:Date.now(),
      duration:SPIN_DURATION,
      winnerIndex:winnerIndex,
      winnerName:winnerName
    }
  );


  rotation +=
    360*25 +
    (360-center);


  canvas.style.transform=
    `rotate(${rotation}deg)`;


  /*
  After 20 seconds,
  mark it as finished.
  */

  setTimeout(async()=>{

    await set(
      ref(db,"giveaway/spin"),
      {
        id:spinId,
        status:"finished",
        startedAt:spinId,
        duration:SPIN_DURATION,
        winnerIndex:winnerIndex,
        winnerName:winnerName
      }
    );


    document.getElementById("winnerName")
    .textContent=winnerName;

    document.getElementById("winner")
    .classList.add("show");

    spinning=false;

    document.getElementById("spinBtn")
    .disabled=false;

  },SPIN_DURATION);

};


/* RESET */

document.getElementById("resetBtn")
.onclick=async()=>{

  if(spinning) return;

  await remove(
    ref(db,"giveaway/spin")
  );

  document.getElementById("winner")
  .classList.remove("show");

  rotation=0;

  canvas.style.transition="none";

  canvas.style.transform="rotate(0deg)";

  setTimeout(()=>{
    canvas.style.transition=
      "transform 20s cubic-bezier(.12,.85,.15,1)";
  },50);

};

</script>

</body>
</html>
