<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMD Admin</title>

<style>
:root{
  --gold:#f6bf38;
  --red:#b72a20;
  --green:#386b48;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  text-align:center;
  background:
    radial-gradient(circle at 50% 10%,rgba(255,129,30,.16),transparent 26%),
    radial-gradient(circle at 15% 65%,rgba(183,42,32,.20),transparent 24%),
    radial-gradient(circle at 85% 55%,rgba(246,191,56,.11),transparent 20%),
    #070707;
}

.header{padding:34px 16px 10px}

.badge{
  display:inline-block;
  border:1px solid #4a4a4a;
  background:#111;
  border-radius:999px;
  padding:7px 13px;
  color:var(--gold);
  font-weight:800;
  letter-spacing:2px;
  font-size:.72rem;
}

.header h1{
  margin:12px 0 8px;
  font-size:clamp(2.2rem,9vw,5rem);
  font-style:italic;
  text-transform:uppercase;
  line-height:.9;
}

.rockin{color:#fff}
.duckers{color:var(--gold)}

.header p{
  color:#aaa;
  margin:14px 0 0;
}

.admin-panel,
.entries{
  width:min(92vw,760px);
  margin:0 auto 24px;
  background:rgba(18,18,20,.92);
  border:1px solid #333;
  border-radius:20px;
  padding:16px;
}

.add-row{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:12px;
  border:1px solid #555;
  background:#0b0b0c;
  color:#fff;
  font-size:1rem;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 17px;
  font-size:.95rem;
  font-weight:900;
  cursor:pointer;
  text-transform:uppercase;
  background:var(--gold);
  color:#111;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.admin-tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.secondary{
  background:#2a2a2d;
  color:#fff;
}

.danger{
  background:#a9221b;
  color:#fff;
}

.purple{
  background:#7d52c7;
  color:#fff;
}

.status{
  color:var(--gold);
  font-weight:bold;
}

.wheel-area{
  position:relative;
  width:min(92vw,690px);
  aspect-ratio:1;
  margin:18px auto 26px;
}

#pointer{
  position:absolute;
  z-index:8;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:31px solid transparent;
  border-right:31px solid transparent;
  border-top:62px solid var(--gold);
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:11px solid var(--gold);
  background:#1b1b1b;
  box-shadow:
    0 0 0 6px #151515,
    0 0 45px rgba(246,191,56,.32);
  transition:transform 6s cubic-bezier(.14,.85,.14,1);
}

.entries h3{
  color:var(--gold);
  letter-spacing:2px;
}

.entry{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#18181a;
  border:1px solid #343434;
  border-radius:12px;
  padding:11px 13px;
  margin:7px 0;
  text-align:left;
}

.actions{
  display:flex;
  gap:6px;
}

.mini{
  padding:6px 10px;
  font-size:.8rem;
}

#count{
  color:#bbb;
  margin-bottom:12px;
}

.empty{
  color:#777;
  padding:18px;
}

#winner{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:30;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#winner.show{
  display:flex;
}

.winner-box{
  background:linear-gradient(145deg,#202023,#101011);
  border:4px solid var(--gold);
  border-radius:28px;
  padding:42px 25px;
  max-width:560px;
  width:100%;
  box-shadow:0 0 70px rgba(246,191,56,.48);
}

.winner-box h2{
  font-size:1rem;
  letter-spacing:2px;
  color:var(--gold);
}

#winnerName{
  font-size:clamp(2.2rem,11vw,4.8rem);
  margin:0;
  word-break:break-word;
}

@media(max-width:520px){
  .add-row{
    flex-direction:column;
  }

  .admin-tools{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">

  <span class="badge">🔒 ADMIN ONLY</span>

  <h1>
    <span class="rockin">RMD</span>
    <span class="duckers">ADMIN</span>
  </h1>

  <p>🦆 GIVEAWAY CONTROL PANEL</p>

</div>

<div class="admin-panel">

  <div class="add-row">

    <input
      id="nameInput"
      maxlength="60"
      placeholder="Enter a name..."
    >

    <button id="addBtn">
      + Add Entry
    </button>

  </div>

  <div class="admin-tools">

    <button id="shuffleBtn" class="purple">
      🔀 Shuffle Entries
    </button>

    <button id="soundBtn" class="secondary">
      🔇 Sound: OFF
    </button>

    <button id="spinBtn">
      🦆 Spin The Mother Ducker!
    </button>

    <button id="resetBtn" class="danger">
      Reset Display
    </button>

  </div>

  <p class="status">
    Connected
  </p>

</div>

<div class="wheel-area">

  <div id="pointer"></div>

  <canvas
    id="wheel"
    width="700"
    height="700"
  ></canvas>

</div>

<div class="entries">

  <h3>ADMIN ENTRIES</h3>

  <div id="count"></div>

  <div id="entryList"></div>

</div>

<div id="winner">

  <div class="winner-box">

    <h2>
      🦆 WINNER WINNER MOTHER DUCKER! 🦆
    </h2>

    <h1 id="winnerName"></h1>

    <br>

    <button id="closeWinner">
      Close
    </button>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCScB2EiV47XvJ0Jm5smJ7Z_B_l8j3NGho",
  authDomain:"rmd-giveaway.firebaseapp.com",
  databaseURL:"https://rmd-giveaway-default-rtdb.firebaseio.com",
  projectId:"rmd-giveaway",
  storageBucket:"rmd-giveaway.firebasestorage.app",
  messagingSenderId:"891164634736",
  appId:"1:891164634736:web:cb0a15e2cff8700f924eb5"
};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const canvas=document.getElementById("wheel");

const ctx=canvas.getContext("2d");

let entries=[];

let rotation=0;

let spinning=false;

let soundEnabled=false;


/* DRAW WHEEL */

function drawWheel(){

  const s=700;

  const c=350;

  const r=342;

  ctx.clearRect(0,0,s,s);

  if(!entries.length){

    ctx.beginPath();

    ctx.arc(
      c,
      c,
      r,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#222";

    ctx.fill();

    ctx.fillStyle="#f6bf38";

    ctx.font="bold 28px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "ADD ENTRIES",
      c,
      c
    );

    return;
  }

  const slice=
    Math.PI*2/
    entries.length;

  entries.forEach((name,i)=>{

    const start=
      i*slice-
      Math.PI/2;

    ctx.beginPath();

    ctx.moveTo(c,c);

    ctx.arc(
      c,
      c,
      r,
      start,
      start+slice
    );

    ctx.closePath();

    ctx.fillStyle=

      i%3===0
        ? "#b72a20"

        : i%3===1
        ? "#1b1b1d"

        : "#386b48";

    ctx.fill();

    ctx.strokeStyle="#f6bf38";

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.save();

    ctx.translate(c,c);

    ctx.rotate(
      start+slice/2
    );

    ctx.fillStyle="#fff";

    ctx.font=`bold ${
      Math.max(
        10,
        Math.min(
          22,
          220/entries.length
        )
      )
    }px Arial`;

    ctx.textAlign="right";

    const displayName=
      name.length>20
        ? name.slice(0,20)+"…"
        : name;

    ctx.fillText(
      displayName,
      r-28,
      6
    );

    ctx.restore();

  });

  ctx.beginPath();

  ctx.arc(
    c,
    c,
    70,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#f6bf38";

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    c,
    c,
    55,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#101010";

  ctx.fill();

  ctx.fillStyle="#f6bf38";

  ctx.font="bold 16px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "RMD",
    c,
    c+6
  );

}


/* RENDER */

function render(){

  document
  .getElementById("count")
  .textContent=

    `${entries.length} total ${
      entries.length===1
        ? "entry"
        : "entries"
    }`;

  const list=
    document.getElementById(
      "entryList"
    );

  list.innerHTML="";

  entries.forEach((name,index)=>{

    const row=
      document.createElement("div");

    row.className="entry";

    const nameText=
      document.createElement("span");

    nameText.textContent=name;

    const actions=
      document.createElement("div");

    actions.className="actions";


    const plus=
      document.createElement("button");

    plus.className="mini";

    plus.textContent="+1";

    plus.onclick=()=>{

      if(spinning) return;

      entries.splice(
        index+1,
        0,
        name
      );

      saveEntries();

    };


    const remove=
      document.createElement("button");

    remove.className=
      "mini danger";

    remove.textContent=
      "Remove";

    remove.onclick=()=>{

      if(spinning) return;

      entries.splice(
        index,
        1
      );

      saveEntries();

    };


    actions.append(
      plus,
      remove
    );

    row.append(
      nameText,
      actions
    );

    list.append(row);

  });

  if(!entries.length){

    list.innerHTML=
      `<div class="empty">
        No entries yet.
      </div>`;

  }

  drawWheel();

}


function saveEntries(){

  set(
    ref(
      db,
      "giveaway/entries"
    ),
    entries
  );

}


/* FIREBASE ENTRIES */

onValue(
  ref(
    db,
    "giveaway/entries"
  ),

  snapshot=>{

    entries=

      Array.isArray(
        snapshot.val()
      )

      ? snapshot
        .val()
        .filter(Boolean)

      : [];

    render();

  }
);


/* ADD ENTRY */

function addEntry(){

  const input=
    document.getElementById(
      "nameInput"
    );

  const name=
    input.value.trim();

  if(!name) return;

  entries.push(name);

  input.value="";

  saveEntries();

}


document
.getElementById("addBtn")
.onclick=addEntry;


document
.getElementById("nameInput")
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter"
    ){

      addEntry();

    }

  }
);


/* SHUFFLE */

document
.getElementById("shuffleBtn")
.onclick=()=>{

  if(spinning) return;

  if(entries.length<2){

    alert(
      "You need at least 2 entries."
    );

    return;

  }

  for(
    let i=
      entries.length-1;

    i>0;

    i--
  ){

    const j=
      Math.floor(
        Math.random()*
        (i+1)
      );

    [
      entries[i],
      entries[j]
    ]

    =

    [
      entries[j],
      entries[i]
    ];

  }

  saveEntries();

};


/* SOUND CONTROL */

onValue(
  ref(
    db,
    "giveaway/settings/soundEnabled"
  ),

  snapshot=>{

    soundEnabled=
      !!snapshot.val();

    const button=
      document.getElementById(
        "soundBtn"
      );

    button.textContent=

      soundEnabled

      ? "🔊 Sound: ON"

      : "🔇 Sound: OFF";

  }
);


document
.getElementById("soundBtn")
.onclick=()=>{

  set(
    ref(
      db,
      "giveaway/settings/soundEnabled"
    ),

    !soundEnabled
  );

};


/* SPIN */

document
.getElementById("spinBtn")
.onclick=async()=>{

  if(
    spinning ||
    entries.length<2
  ){

    alert(
      "Add at least 2 entries."
    );

    return;

  }

  spinning=true;

  document
  .getElementById("spinBtn")
  .disabled=true;


  const winnerIndex=

    Math.floor(
      Math.random()*
      entries.length
    );


  const deg=
    360/
    entries.length;


  const center=
    winnerIndex*deg+
    deg/2;


  rotation+=
    360*8+
    (360-center);


  canvas.style.transform=
    `rotate(${rotation}deg)`;


  await set(

    ref(
      db,
      "giveaway/spin"
    ),

    {

      id:Date.now(),

      winnerIndex:winnerIndex,

      sound:soundEnabled

    }

  );


  setTimeout(()=>{

    document
    .getElementById(
      "winnerName"
    )
    .textContent=
      entries[winnerIndex];


    document
    .getElementById(
      "winner"
    )
    .classList.add("show");


    spinning=false;


    document
    .getElementById(
      "spinBtn"
    )
    .disabled=false;

  },6100);

};


/* RESET */

document
.getElementById("resetBtn")
.onclick=()=>{

  if(spinning) return;

  rotation=0;

  canvas.style.transition="none";

  canvas.style.transform=
    "rotate(0deg)";

  setTimeout(()=>{

    canvas.style.transition=
      "transform 6s cubic-bezier(.14,.85,.14,1)";

  },50);

};


/* CLOSE WINNER */

document
.getElementById("closeWinner")
.onclick=()=>{

  document
  .getElementById("winner")
  .classList.remove("show");

};

</script>

</body>
</html>
