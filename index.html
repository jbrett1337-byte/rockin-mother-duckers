<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMD Giveaway</title>

<style>
:root{--gold:#f6bf38;--red:#b72a20;--green:#386b48}
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  text-align:center;
  background:
    radial-gradient(circle at 50% 10%,rgba(255,129,30,.16),transparent 26%),
    radial-gradient(circle at 15% 65%,rgba(183,42,32,.20),transparent 24%),
    radial-gradient(circle at 85% 55%,rgba(246,191,56,.11),transparent 20%),
    #070707;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background:repeating-linear-gradient(
    115deg,
    transparent 0 45px,
    rgba(255,255,255,.025) 46px 48px
  );
  z-index:-1;
}

.header{padding:34px 16px 10px}

.badge{
  display:inline-block;
  border:1px solid #4a4a4a;
  background:#111;
  border-radius:999px;
  padding:7px 13px;
  color:var(--gold);
  font-weight:800;
  letter-spacing:2px;
  font-size:.72rem;
}

.header h1{
  margin:12px 0 8px;
  font-size:clamp(2.2rem,9vw,5rem);
  font-style:italic;
  text-transform:uppercase;
  line-height:.9;
  letter-spacing:1px;
  text-shadow:0 0 28px rgba(246,191,56,.16);
}

.rockin{color:#fff}
.duckers{color:var(--gold)}

.header p{
  color:#aaa;
  font-size:1.05rem;
  margin:14px 0 0;
}

.wheel-area{
  position:relative;
  width:min(92vw,690px);
  aspect-ratio:1;
  margin:18px auto 26px;
  filter:drop-shadow(0 20px 35px rgba(0,0,0,.7));
}

#pointer{
  position:absolute;
  z-index:8;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:31px solid transparent;
  border-right:31px solid transparent;
  border-top:62px solid var(--gold);
  filter:drop-shadow(0 4px 3px #000);
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:11px solid var(--gold);
  background:#1b1b1b;
  box-shadow:
    0 0 0 6px #151515,
    0 0 45px rgba(246,191,56,.32);
  transition:transform 6s cubic-bezier(.14,.85,.14,1);
}

.entries{
  width:min(92vw,760px);
  margin:0 auto 32px;
  background:rgba(18,18,20,.9);
  border:1px solid #333;
  border-radius:20px;
  padding:16px;
}

.entries h3{
  color:var(--gold);
  letter-spacing:2px;
  margin:4px 0 8px;
}

.entry{
  background:#18181a;
  border:1px solid #343434;
  border-radius:12px;
  padding:11px 13px;
  margin:7px 0;
  text-align:left;
}

#count{
  color:#bbb;
  margin-bottom:12px;
}

.empty{
  color:#777;
  padding:18px;
}

.footer{
  color:#666;
  padding:25px;
  font-size:.8rem;
  letter-spacing:1px;
}

#winner{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:30;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#winner.show{
  display:flex;
}

.winner-box{
  background:linear-gradient(145deg,#202023,#101011);
  border:4px solid var(--gold);
  border-radius:28px;
  padding:42px 25px;
  max-width:560px;
  width:100%;
  box-shadow:0 0 70px rgba(246,191,56,.48);
}

.winner-box h2{
  font-size:1rem;
  letter-spacing:2px;
  color:var(--gold);
}

#winnerName{
  font-size:clamp(2.2rem,11vw,4.8rem);
  margin:0;
  word-break:break-word;
}

.confetti{
  position:fixed;
  width:9px;
  height:15px;
  top:-20px;
  z-index:35;
  animation:fall 2.7s linear forwards;
}

@keyframes fall{
  to{
    transform:translate(var(--x),110vh) rotate(720deg);
    opacity:0;
  }
}

.sound-gate{
  position:fixed;
  left:16px;
  right:16px;
  bottom:18px;
  z-index:25;
  background:#151517;
  border:1px solid #444;
  border-radius:18px;
  padding:14px;
  display:none;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:900;
  background:var(--gold);
  color:#111;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <span class="badge">LIVE GIVEAWAY</span>

  <h1>
    <span class="rockin">ROCKIN MOTHER</span><br>
    <span class="duckers">DUCKERS</span>
  </h1>

  <p>🦆 800 MEMBER GIVEAWAY 🎡</p>
</div>

<p style="color:#aaa;margin:0 12px 8px">
  Sit back and watch the wheel. 🤘🦆
</p>

<div class="wheel-area">
  <div id="pointer"></div>
  <canvas id="wheel" width="700" height="700"></canvas>
</div>

<div class="entries">
  <h3>GIVEAWAY ENTRIES</h3>
  <div id="count"></div>
  <div id="entryList"></div>
</div>

<div id="winner">
  <div class="winner-box">
    <h2>🦆 WINNER WINNER MOTHER DUCKER! 🦆</h2>
    <h1 id="winnerName"></h1>
  </div>
</div>

<div id="soundGate" class="sound-gate">
  🔊 Sound is enabled for this giveaway.
  <br>
  <small style="color:#aaa">
    Tap once to allow your browser to play the live wheel sounds.
  </small>
  <br><br>
  <button id="enableSound">Enable Sound</button>
</div>

<div class="footer">
  ROCKIN MOTHER DUCKERS • LIVE GIVEAWAY
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCScB2EiV47XvJ0Jm5smJ7Z_B_l8j3NGho",
  authDomain:"rmd-giveaway.firebaseapp.com",
  databaseURL:"https://rmd-giveaway-default-rtdb.firebaseio.com",
  projectId:"rmd-giveaway",
  storageBucket:"rmd-giveaway.firebasestorage.app",
  messagingSenderId:"891164634736",
  appId:"1:891164634736:web:cb0a15e2cff8700f924eb5"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let entries=[];
let rotation=0;
let lastSpinId=null;
let spinning=false;
let soundEnabled=false;
let audioReady=false;

function drawWheel(){

  const s=700;
  const c=350;
  const r=342;

  ctx.clearRect(0,0,s,s);

  if(!entries.length){

    ctx.beginPath();
    ctx.arc(c,c,r,0,Math.PI*2);
    ctx.fillStyle="#222";
    ctx.fill();

    ctx.fillStyle="#f6bf38";
    ctx.font="bold 28px Arial";
    ctx.textAlign="center";
    ctx.fillText("WAITING FOR ENTRIES",c,c);

    return;
  }

  const slice=Math.PI*2/entries.length;

  entries.forEach((name,i)=>{

    const start=i*slice-Math.PI/2;

    ctx.beginPath();
    ctx.moveTo(c,c);
    ctx.arc(c,c,r,start,start+slice);
    ctx.closePath();

    ctx.fillStyle=
      i%3===0 ? "#b72a20" :
      i%3===1 ? "#1b1b1d" :
      "#386b48";

    ctx.fill();

    ctx.strokeStyle="#f6bf38";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.save();

    ctx.translate(c,c);
    ctx.rotate(start+slice/2);

    ctx.fillStyle="#fff";

    ctx.font=`bold ${
      Math.max(10,Math.min(22,220/entries.length))
    }px Arial`;

    ctx.textAlign="right";

    ctx.fillText(
      name.length>20
        ? name.slice(0,20)+"…"
        : name,
      r-28,
      6
    );

    ctx.restore();

  });

  ctx.beginPath();
  ctx.arc(c,c,70,0,Math.PI*2);
  ctx.fillStyle="#f6bf38";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(c,c,55,0,Math.PI*2);
  ctx.fillStyle="#101010";
  ctx.fill();

  ctx.fillStyle="#f6bf38";
  ctx.font="bold 16px Arial";
  ctx.textAlign="center";
  ctx.fillText("RMD",c,c+6);
}

function render(){

  document.getElementById("count").textContent=
    `${entries.length} total ${
      entries.length===1 ? "entry" : "entries"
    }`;

  document.getElementById("entryList").innerHTML=
    entries.length
      ? entries.map(name=>`
        <div class="entry">${name}</div>
      `).join("")
      : `<div class="empty">Entries will appear here.</div>`;

  drawWheel();
}

function tone(freq,duration,type="square",volume=.045){

  if(!audioReady || !soundEnabled) return;

  const AudioCtx=
    window.AudioContext ||
    window.webkitAudioContext;

  const audioContext=
    window.__rmdAudio ||
    (window.__rmdAudio=new AudioCtx());

  const oscillator=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();

  oscillator.type=type;
  oscillator.frequency.value=freq;

  gain.gain.value=volume;

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+duration
  );

  oscillator.stop(
    audioContext.currentTime+duration
  );
}

function confetti(){

  for(let i=0;i<90;i++){

    const piece=document.createElement("i");

    piece.className="confetti";

    piece.style.left=
      Math.random()*100+"vw";

    piece.style.setProperty(
      "--x",
      (Math.random()-.5)*500+"px"
    );

    piece.style.background=
      ["#f6bf38","#b72a20","#fff","#386b48"][i%4];

    document.body.append(piece);

    setTimeout(
      ()=>piece.remove(),
      3200
    );
  }
}

document
.getElementById("enableSound")
.onclick=()=>{

  audioReady=true;

  const AudioCtx=
    window.AudioContext ||
    window.webkitAudioContext;

  const audioContext=
    window.__rmdAudio ||
    (window.__rmdAudio=new AudioCtx());

  audioContext.resume();

  document
  .getElementById("soundGate")
  .style.display="none";
};

onValue(
  ref(db,"giveaway/entries"),
  snapshot=>{

    entries=
      Array.isArray(snapshot.val())
        ? snapshot.val().filter(Boolean)
        : [];

    render();
  }
);

onValue(
  ref(db,"giveaway/settings/soundEnabled"),
  snapshot=>{

    soundEnabled=!!snapshot.val();

    document
    .getElementById("soundGate")
    .style.display=
      soundEnabled && !audioReady
        ? "block"
        : "none";
  }
);

onValue(
  ref(db,"giveaway/spin"),
  snapshot=>{

    const data=snapshot.val();

    if(
      !data ||
      data.id===lastSpinId ||
      spinning
    ) return;

    lastSpinId=data.id;

    if(
      data.winnerIndex<0 ||
      data.winnerIndex>=entries.length
    ) return;

    spinning=true;

    const deg=
      360/entries.length;

    const center=
      data.winnerIndex*deg+
      deg/2;

    rotation+=
      360*8+
      (360-center);

    canvas.style.transform=
      `rotate(${rotation}deg)`;

    if(data.sound){

      let tick=0;

      const interval=setInterval(()=>{

        tone(
          700+(tick%2)*130,
          .025,
          "square",
          .03
        );

        tick++;

      },120);

      setTimeout(
        ()=>clearInterval(interval),
        5900
      );
    }

    setTimeout(()=>{

      if(data.sound){

        tone(
          180,
          .6,
          "sawtooth",
          .07
        );

        setTimeout(()=>{

          tone(
            520,
            .8,
            "triangle",
            .08
          );

        },250);
      }

      document
      .getElementById("winnerName")
      .textContent=
        entries[data.winnerIndex];

      document
      .getElementById("winner")
      .classList.add("show");

      confetti();

      spinning=false;

    },6100);

  }
);

</script>

</body>
</html>
